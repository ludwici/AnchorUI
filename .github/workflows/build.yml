name: Build

on:
  push:
    branches:
      - "1.20.1"
      - "1.21.1"
      - "1.21.1-fabric"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.adoc"
      - "**/*.rst"
  pull_request:
    branches:
      - "1.20.1"
      - "1.21.1"
      - "1.21.1-fabric"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.adoc"
      - "**/*.rst"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.ref_name == '1.20.1' && '17' || '21' }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ github.ref_name == '1.21.1-fabric' && '8.14.3' || '8.8' }}
      - name: Check Java method-call formatting
        run: python3 tools/format_java_calls.py --check
      - name: Build with Gradle
        run: gradle build --no-daemon --stacktrace
      - name: Validate Fabric JAR metadata
        if: github.ref_name == '1.21.1-fabric'
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'anchorui-fabric-*+*.jar' -print -quit)
          test -n "$JAR"
          python3 - "$JAR" <<'PY'
          import json
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as jar:
              metadata = json.loads(jar.read("fabric.mod.json"))
              assert metadata["id"] == "anchorui"
              assert metadata["version"] != "$" + "{mod_version}"
              assert metadata["entrypoints"]["client"]
              assert "anchorui.mixins.json" in jar.namelist()
              assert "META-INF/neoforge.mods.toml" not in jar.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: anchorui-${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}-${{ github.run_number }}
          path: ${{ github.ref_name == '1.21.1-fabric' && 'build/libs/*fabric*+*.jar' || 'build/libs/*.jar' }}
          if-no-files-found: error

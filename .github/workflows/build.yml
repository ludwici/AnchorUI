name: Build

on:
  push:
    branches:
      - "1.20.1"
      - "1.21.1"
      - "1.21.1-fabric"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.adoc"
      - "**/*.rst"
  pull_request:
    branches:
      - "1.20.1"
      - "1.21.1"
      - "1.21.1-fabric"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.adoc"
      - "**/*.rst"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.ref_name == '1.20.1' && '17' || '21' }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ github.ref_name == '1.21.1-fabric' && '8.14.3' || '8.8' }}
      - name: Check Java method-call formatting
        run: python3 tools/format_java_calls.py --check
      - name: Build with Gradle
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: anchorui-${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error

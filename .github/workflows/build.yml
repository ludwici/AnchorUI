name: Build

on:
  push:
    branches:
      - "1.20.1"
      - "1.21.1"
  pull_request:
    branches:
      - "1.20.1"
      - "1.21.1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.ref_name == '1.20.1' && '17' || '21' }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: anchorui-${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error

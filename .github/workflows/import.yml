name: Import source branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anchorui-source"
          cat import/both.part* | base64 --decode > "$RUNNER_TEMP/anchorui-source.tar.xz"
          echo "b8a80428ba16c4ab9267ae119269da74318c493ab3a1992d6a244a3b291fe3e2  $RUNNER_TEMP/anchorui-source.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/anchorui-source.tar.xz" -C "$RUNNER_TEMP/anchorui-source"
          test -f "$RUNNER_TEMP/anchorui-source/1.20.1/build.gradle"
          test -f "$RUNNER_TEMP/anchorui-source/1.21.1/build.gradle"

      - name: Create 1.20.1 and 1.21.1 branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for version in 1.20.1 1.21.1; do
            git checkout -B "$version" origin/main
            git rm -r --quiet --ignore-unmatch .
            git clean -fdx
            cp -a "$RUNNER_TEMP/anchorui-source/$version/." .
            git add -A
            git commit -m "Import Anchor UI $version source and build workflow"
            git push origin "HEAD:refs/heads/$version"
          done

      - name: Remove temporary import data from main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          git rm -r -q import .github/workflows/import.yml
          git commit -m "Clean up temporary source import"
          git push origin HEAD:main
